plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yuvraj.connect4'
    compileSdk 35

    defaultConfig {
        applicationId 'com.yuvraj.connect4'
        minSdk 25          // Fire OS 6+ (all current Fire TV devices) and Android TV
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The engine and game controller are shared, unchanged, with the desktop test suite (./verify.sh).
    sourceSets {
        main.java.srcDirs += '../engine/src/main/java'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

// No dependencies: plain Android SDK only.
